<!-- change-password.html — in-app reset password flow -->
<div class="hero common-hero">
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <div class="hero-ct">
                    <h1>Reset Password</h1>
                    <ul class="breadcumb">
                        <li class="active"><a href="#/login">Login</a></li>
                        <li><span class="ion-ios-arrow-right"></span> Reset Password</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="page-single">
    <div class="container">
        <div class="row">
            <div class="col-md-6 col-md-offset-3">
                <div class="login-wrap">
                    <p style="color:#abb7c4; margin-bottom:18px;">Request a code by email, verify it, then set a new password.</p>

                    <div class="login-field">
                        <label style="color:#abb7c4; display:block; margin-bottom:4px;">Email</label>
                        <input type="email" ng-model="email" ng-change="clearErrorMsg()" ng-disabled="modelE.isDisabled"
                               placeholder="Enter your email" class="date-select" style="margin:0 0 12px;">
                        <button class="btn-book" style="width:100%;" ng-click="forgetPsw()" ng-disabled="modelE.isDisabled || !email">
                            Request Reset Code
                        </button>
                    </div>

                    <div class="alert-err" ng-if="errorMsg">{{errorMsg}}</div>
                    <div class="alert-ok" ng-if="successMsg">{{successMsg}}</div>

                    <div class="login-field" style="margin-top:18px;">
                        <label style="color:#abb7c4; display:block; margin-bottom:4px;">Confirmation Code</label>
                        <input type="text" ng-model="confirmationCode" ng-disabled="modelC.isDisabled"
                               placeholder="Enter code from email" class="date-select" style="margin:0 0 12px;">
                        <button class="btn-book" style="width:100%;" ng-click="enterCode()"
                                ng-disabled="modelC.isDisabled || !confirmationCode">
                            Verify Code
                        </button>
                    </div>

                    <div class="alert-err" ng-if="error_Msg">{{error_Msg}}</div>
                    <div class="alert-ok" ng-if="success_Msg">{{success_Msg}}</div>

                    <div class="login-field" style="margin-top:18px;">
                        <label style="color:#abb7c4; display:block; margin-bottom:4px;">New Password</label>
                        <input type="password" ng-model="password" ng-disabled="modelP.isDisabled"
                               placeholder="Enter new password" class="date-select" style="margin:0 0 12px;">
                        <button class="btn-book" style="width:100%;" ng-click="changePSw()"
                                ng-disabled="modelP.isDisabled || !password">
                            Change Password
                        </button>
                    </div>

                    <div class="alert-err" ng-if="errorMsg_">{{errorMsg_}}</div>
                    <div class="alert-ok" ng-if="successMsg_">{{successMsg_}}</div>

                    <div style="text-align:center; margin-top:16px;">
                        <a href="#/login" style="color:#abb7c4;">Back to Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
